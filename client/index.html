<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- Warm up the CDNs used by the migrated legacy pages. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://verify.msg91.com" crossorigin />

    <title>TRIPZOVA</title>

    <!--
      Critical boot/route-loader CSS is deliberately inline so it is available
      before React and before any route-specific stylesheet. This prevents the
      browser from briefly showing unstyled JSX during refresh/navigation.
    -->
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f7fbfb;
      }

      #tripzova-route-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7fbfb;
        opacity: 1;
        visibility: visible;
        pointer-events: all;
        transition: opacity 140ms ease, visibility 140ms ease;
      }

      body.tripzova-page-ready #tripzova-route-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .tripzova-loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 13px;
        color: #172033;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .tripzova-loader-logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: #39b9ad;
        box-shadow: 0 10px 28px rgba(57, 185, 173, 0.22);
        color: #fff;
        font-size: 25px;
        font-weight: 800;
        line-height: 1;
        animation: tripzova-loader-pulse 900ms ease-in-out infinite alternate;
      }

      .tripzova-loader-text {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .15em;
      }

      @keyframes tripzova-loader-pulse {
        from { transform: translateY(0) scale(.98); opacity: .82; }
        to { transform: translateY(-2px) scale(1); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        #tripzova-route-loader { transition: none; }
        .tripzova-loader-logo { animation: none; }
      }
    </style>
  </head>
  <body aria-busy="true">
    <div id="tripzova-route-loader" aria-hidden="true">
      <div class="tripzova-loader-inner">
        <div class="tripzova-loader-logo">T</div>
        <div class="tripzova-loader-text">TRIPZOVA</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
